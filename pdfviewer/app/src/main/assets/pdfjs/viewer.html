<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
<style>
  html,body{margin:0;padding:0;background:#525659;}
  #pages{display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:10px;}
  .page{position:relative;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);}
  canvas{display:block;}
  /* Transparent, positioned text spans over the canvas → native selection + copy. */
  .textLayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;line-height:1;
    -webkit-text-size-adjust:none;text-size-adjust:none;}
  .textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;
    cursor:text;transform-origin:0 0;}
  .textLayer ::selection{background:rgba(0,120,255,.35);}
  #msg{color:#eee;font-family:sans-serif;text-align:center;padding:24px;}
</style>
</head>
<body>
<div id="pages"></div>
<div id="msg"></div>
<script src="pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  // Render ABOVE the screen's native pixel density (supersample) so pages are
  // crisp — and stay crisp when pinch-zoomed. Only the pages near the viewport
  // are rendered (see windowing below), so the higher resolution is affordable.
  var deviceDpr = window.devicePixelRatio || 1;
  var dpr = Math.min(Math.max(deviceDpr, 2) * 1.5, 4.5);
  var MAX_CANVAS_PX = 12000000; // per-page bitmap ceiling (~48 MB), a few pages max

  function showMsg(t){ document.getElementById('msg').textContent = t; }

  (async function () {
    var pdf;
    try {
      pdf = await pdfjsLib.getDocument({ url: "/pdf/doc.pdf" }).promise;
    } catch (e) {
      showMsg("تعذّر عرض الملف: " + (e && e.message ? e.message : e));
      return;
    }
    var container = document.getElementById('pages');
    var cssWidth = document.documentElement.clientWidth - 8;
    var slots = []; // one per page: {div, fit, w, h, rendered}

    // 1) Lay out placeholders at the correct size (no rendering yet) so the
    //    document scrolls correctly without holding every page's bitmap.
    for (var n = 1; n <= pdf.numPages; n++) {
      var page = await pdf.getPage(n);
      var base = page.getViewport({ scale: 1 });
      var fit = Math.max(0.2, cssWidth / base.width);
      var vp = page.getViewport({ scale: fit });
      var div = document.createElement('div');
      div.className = 'page';
      div.style.width = vp.width + 'px';
      div.style.height = vp.height + 'px';
      div.style.setProperty('--scale-factor', String(fit));
      container.appendChild(div);
      slots.push({ div: div, num: n, fit: fit, w: vp.width, h: vp.height, rendered: false });
      page.cleanup(); // release page resources until it's actually shown
    }

    async function renderSlot(slot) {
      if (slot.rendered) return;
      slot.rendered = true;
      try {
        var page = await pdf.getPage(slot.num);
        var scale = slot.fit * dpr;
        // Clamp so width*height never exceeds the ceiling.
        var w = slot.w * dpr, h = slot.h * dpr;
        if (w * h > MAX_CANVAS_PX) { var k = Math.sqrt(MAX_CANVAS_PX / (w * h)); scale *= k; }
        var renderVp = page.getViewport({ scale: scale });
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.floor(renderVp.width));
        canvas.height = Math.max(1, Math.floor(renderVp.height));
        canvas.style.width = slot.w + 'px';
        canvas.style.height = slot.h + 'px';
        slot.div.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: renderVp }).promise;
        var textContent = await page.getTextContent();
        var textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'textLayer';
        textLayerDiv.style.width = slot.w + 'px';
        textLayerDiv.style.height = slot.h + 'px';
        slot.div.appendChild(textLayerDiv);
        pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: page.getViewport({ scale: slot.fit }),
          textDivs: []
        });
        slot.canvas = canvas;
        slot.page = page;
      } catch (e) {
        slot.rendered = false;
      }
    }

    function freeSlot(slot) {
      if (!slot.rendered) return;
      slot.rendered = false;
      // Remove the heavy canvas + text layer; keep the sized placeholder.
      while (slot.div.firstChild) slot.div.removeChild(slot.div.firstChild);
      if (slot.canvas) { slot.canvas.width = 0; slot.canvas.height = 0; slot.canvas = null; }
      if (slot.page) { try { slot.page.cleanup(); } catch (e) {} slot.page = null; }
    }

    // 2) Render ONLY the pages within a margin of the viewport; free the rest.
    //    Deterministic windowing keeps memory bounded no matter how many pages
    //    the document has (a big PDF used to render every page at once → crash).
    var MARGIN = 1200; // px above/below the viewport to keep rendered
    function update() {
      var vpTop = window.scrollY || window.pageYOffset || 0;
      var vpBot = vpTop + window.innerHeight;
      for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        var top = s.div.offsetTop;
        var bot = top + s.h;
        var near = bot >= (vpTop - MARGIN) && top <= (vpBot + MARGIN);
        if (near) renderSlot(s); else freeSlot(s);
      }
    }
    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(function () { ticking = false; update(); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    update();
  })();
</script>
</body>
</html>
