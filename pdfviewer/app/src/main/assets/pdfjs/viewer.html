<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=12, user-scalable=yes">
<style>
  html,body{margin:0;padding:0;background:#525659;}
  #pages{display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:10px;}
  .page{position:relative;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);}
  canvas.base{display:block;}
  canvas.detail{position:absolute;pointer-events:none;z-index:1;}
  .textLayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;line-height:1;z-index:2;
    -webkit-text-size-adjust:none;text-size-adjust:none;}
  .textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;
    cursor:text;transform-origin:0 0;}
  .textLayer ::selection{background:rgba(0,120,255,.35);}
  #msg{color:#eee;font-family:sans-serif;text-align:center;padding:24px;}
</style>
</head>
<body>
<div id="pages"></div>
<div id="msg"></div>
<script src="pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";

  var deviceDpr = window.devicePixelRatio || 1;
  var baseDpr = Math.min(Math.max(deviceDpr, 1.5), 3); // zoomed-out (1x) crispness
  var MAX_BASE_PX = 6000000;   // per full-page base bitmap
  var MAX_TILE_PX = 8000000;   // the single sharp detail tile (~viewport-sized, constant)
  var MARGIN = 400;

  function showMsg(t){ document.getElementById('msg').textContent = t; }
  function liveZoom(){ return (window.visualViewport && visualViewport.scale) ? visualViewport.scale : 1; }
  function viewRect(){
    if (window.visualViewport) return {
      top: visualViewport.pageTop, left: visualViewport.pageLeft,
      bottom: visualViewport.pageTop + visualViewport.height,
      right: visualViewport.pageLeft + visualViewport.width };
    var t = window.scrollY || 0, l = window.scrollX || 0;
    return { top: t, left: l, bottom: t + window.innerHeight, right: l + window.innerWidth };
  }

  (async function () {
    var pdf;
    try { pdf = await pdfjsLib.getDocument({ url: "/pdf/doc.pdf" }).promise; }
    catch (e) { showMsg("تعذّر عرض الملف: " + (e && e.message ? e.message : e)); return; }

    var container = document.getElementById('pages');
    var cssWidth = document.documentElement.clientWidth - 8;
    var slots = [];

    for (var n = 1; n <= pdf.numPages; n++) {
      var page = await pdf.getPage(n);
      var base = page.getViewport({ scale: 1 });
      var fit = Math.max(0.2, cssWidth / base.width);
      var vp = page.getViewport({ scale: fit });
      var div = document.createElement('div');
      div.className = 'page';
      div.style.width = vp.width + 'px';
      div.style.height = vp.height + 'px';
      div.style.setProperty('--scale-factor', String(fit));
      container.appendChild(div);
      slots.push({ div: div, num: n, fit: fit, w: vp.width, h: vp.height, rendered: false, rendering: false });
      page.cleanup();
    }

    // ---- base full-page render (zoomed-out view + text layer for selection) ----
    async function renderSlot(slot) {
      if (slot.rendered || slot.rendering) return;
      slot.rendering = true;
      try {
        var page = await pdf.getPage(slot.num);
        var scale = slot.fit * baseDpr;
        var w = slot.w * baseDpr, h = slot.h * baseDpr;
        if (w * h > MAX_BASE_PX) scale *= Math.sqrt(MAX_BASE_PX / (w * h));
        var rv = page.getViewport({ scale: scale });
        var canvas = document.createElement('canvas');
        canvas.className = 'base';
        canvas.width = Math.max(1, Math.floor(rv.width));
        canvas.height = Math.max(1, Math.floor(rv.height));
        canvas.style.width = slot.w + 'px';
        canvas.style.height = slot.h + 'px';
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: rv }).promise;
        var tc = await page.getTextContent();
        var tl = document.createElement('div');
        tl.className = 'textLayer';
        tl.style.width = slot.w + 'px'; tl.style.height = slot.h + 'px';
        slot.div.appendChild(canvas);
        slot.div.appendChild(tl);
        pdfjsLib.renderTextLayer({ textContentSource: tc, container: tl, viewport: page.getViewport({ scale: slot.fit }), textDivs: [] });
        slot.baseCanvas = canvas; slot.page = page; slot.rendered = true;
      } catch (e) {}
      slot.rendering = false;
    }
    function freeSlot(slot) {
      if (!slot.rendered && !slot.rendering) return;
      slot.rendered = false;
      if (slot === detailSlot) clearDetail();
      while (slot.div.firstChild) slot.div.removeChild(slot.div.firstChild);
      if (slot.baseCanvas) { slot.baseCanvas.width = 0; slot.baseCanvas.height = 0; slot.baseCanvas = null; }
      if (slot.page) { try { slot.page.cleanup(); } catch (e) {} slot.page = null; }
    }
    function updateWindow() {
      var vr = viewRect();
      for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        var top = s.div.offsetTop, bot = top + s.h;
        var near = bot >= (vr.top - MARGIN) && top <= (vr.bottom + MARGIN);
        if (near) renderSlot(s); else freeSlot(s);
      }
    }

    // ---- sharp detail tile: only the VISIBLE region of the focused page, at the
    //      current zoom's true resolution. ~viewport-sized, so memory is constant
    //      no matter how far you zoom in. This is what keeps text crisp at max zoom.
    var detailCanvas = null, detailSlot = null, detailBusy = false;
    function clearDetail() {
      if (detailCanvas && detailCanvas.parentNode) detailCanvas.parentNode.removeChild(detailCanvas);
      detailCanvas = null; detailSlot = null;
    }
    async function updateDetail() {
      var zoom = liveZoom();
      if (zoom <= 1.25 || detailBusy) { if (zoom <= 1.25) clearDetail(); return; }
      var vr = viewRect();
      var focus = null, best = 0;
      for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        if (!s.rendered) continue;
        var pT = s.div.offsetTop, pL = s.div.offsetLeft;
        var ix = Math.max(0, Math.min(pL + s.w, vr.right) - Math.max(pL, vr.left));
        var iy = Math.max(0, Math.min(pT + s.h, vr.bottom) - Math.max(pT, vr.top));
        if (ix * iy > best) { best = ix * iy; focus = { s: s, pT: pT, pL: pL }; }
      }
      if (!focus) { clearDetail(); return; }
      var s = focus.s;
      var sx = Math.max(0, vr.left - focus.pL), sy = Math.max(0, vr.top - focus.pT);
      var ex = Math.min(s.w, vr.right - focus.pL), ey = Math.min(s.h, vr.bottom - focus.pT);
      var subW = ex - sx, subH = ey - sy;
      if (subW < 4 || subH < 4) { clearDetail(); return; }
      var effDpr = deviceDpr * zoom;
      var pxW = subW * effDpr, pxH = subH * effDpr;
      if (pxW * pxH > MAX_TILE_PX) { var k = Math.sqrt(MAX_TILE_PX / (pxW * pxH)); effDpr *= k; }
      detailBusy = true;
      try {
        var page = await pdf.getPage(s.num);
        var full = page.getViewport({ scale: s.fit * effDpr });
        var canvas = document.createElement('canvas');
        canvas.className = 'detail';
        canvas.width = Math.max(1, Math.round(subW * effDpr));
        canvas.height = Math.max(1, Math.round(subH * effDpr));
        canvas.style.left = sx + 'px'; canvas.style.top = sy + 'px';
        canvas.style.width = subW + 'px'; canvas.style.height = subH + 'px';
        await page.render({
          canvasContext: canvas.getContext('2d'),
          viewport: full,
          transform: [1, 0, 0, 1, -sx * effDpr, -sy * effDpr]
        }).promise;
        clearDetail();
        s.div.appendChild(canvas);
        detailCanvas = canvas; detailSlot = s;
        page.cleanup();
      } catch (e) {}
      detailBusy = false;
    }

    var winRaf = false;
    function onScroll() {
      if (!winRaf) { winRaf = true; requestAnimationFrame(function () { winRaf = false; updateWindow(); }); }
      scheduleDetail();
    }
    var detailTimer = null;
    function scheduleDetail() {
      if (detailTimer) clearTimeout(detailTimer);
      detailTimer = setTimeout(updateDetail, 140);
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    if (window.visualViewport) {
      visualViewport.addEventListener('scroll', onScroll, { passive: true });
      visualViewport.addEventListener('resize', onScroll, { passive: true });
    }
    updateWindow();
  })();
</script>
</body>
</html>
