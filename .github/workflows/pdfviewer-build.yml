name: PDF Viewer Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release for the minimal PDF viewer (e.g. pdfviewer-v1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdfviewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfViewer-release
          path: pdfviewer/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pdfviewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage APK with version name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/PdfViewer-${{ inputs.release_tag }}.apk"
          ls -la out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: pdfviewer/out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ---- Self-update channel: a permanent "latest" release that the in-app
      #      updater reads (fixed-name APK + version.json). ----
      - name: Stage latest channel
        run: |
          mkdir -p latest
          cp app/build/outputs/apk/release/*.apk latest/PdfViewer.apk
          VN=$(grep -E 'versionName' app/build.gradle.kts | grep -oE '"[0-9.]+"' | tr -d '"' | head -1)
          VC=$(grep -E 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          cat > latest/version.json <<EOF
          {
            "version": "$VN",
            "build": $VC,
            "url": "https://github.com/${{ github.repository }}/releases/download/latest/PdfViewer.apk"
          }
          EOF
          cat latest/version.json

      - name: Publish/refresh latest channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: |
            pdfviewer/latest/PdfViewer.apk
            pdfviewer/latest/version.json
          fail_on_unmatched_files: true
